<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>아워로그 · 우리 방 2초 일상</title>
<style>
:root{--bg:#faf8f5;--card:#fff;--ink:#222;--mute:#8a8580;--line:#ece7e1;--acc:#ff6b4a;--accbg:#fff0ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17161a;--card:#222126;--ink:#f1eeea;--mute:#8d8993;--line:#34323a;--acc:#ff7d60;--accbg:#3a2a27;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17161a;--card:#222126;--ink:#f1eeea;--mute:#8d8993;--line:#34323a;--acc:#ff7d60;--accbg:#3a2a27;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:18px 16px 80px}
h1{font-size:22px;margin:0}h1 span{color:var(--acc)}
.sub{color:var(--mute);font-size:13px;margin:2px 0 14px}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:12px;padding:10px 16px;background:var(--line);color:var(--ink);font-size:14px}
.btn.p{background:var(--acc);color:#fff}
.btn:disabled{opacity:.4}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px;font:inherit}
.rooms{display:grid;gap:8px;margin:12px 0}
.room{display:flex;justify-content:space-between;align-items:center;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--ink)}
.room small{color:var(--mute)}
.form{display:grid;gap:8px;margin-top:10px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.top h2{margin:0;font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.code{font-size:12px;color:var(--mute);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 8px;color:var(--ink)}
.cal{margin-bottom:14px}
.calh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.calh button{background:none;border:0;color:var(--ink);font-size:18px;padding:4px 12px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:13px}
.grid .w{color:var(--mute);font-size:11px}
.d{position:relative;padding:7px 0;border-radius:10px;background:none;border:0;color:var(--ink)}
.d.on{background:var(--acc);color:#fff}
.d.today{outline:1px solid var(--acc)}
.d i{position:absolute;left:50%;bottom:2px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--acc)}
.d.on i{background:#fff}
.d[disabled]{opacity:.25}
.hour{margin-bottom:14px}
.hour h3{margin:0 0 6px;font-size:13px;color:var(--mute);display:flex;align-items:center;gap:6px}
.hour.now h3{color:var(--acc)}
.clips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.clip{flex:none;width:132px}
.clip video{width:132px;height:176px;object-fit:cover;border-radius:12px;background:#000;display:block}
.clip.me video{outline:2px solid var(--acc)}
.clip small{display:block;color:var(--mute);font-size:12px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec{flex:none;width:132px;height:176px;border-radius:12px;border:2px dashed var(--acc);background:var(--accbg);color:var(--acc);font-weight:700;font-size:14px}
.none{color:var(--mute);font-size:13px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.on{display:flex}
.mbox{width:100%;max-width:340px;text-align:center;color:#fff}
.mbox video{width:100%;max-height:60vh;object-fit:contain;border-radius:18px;background:#000}
.mbox video.mir{transform:scaleX(-1)}
.mbox p{margin:10px 0;font-size:14px;min-height:21px}
.mbox .row{display:flex;gap:8px;justify-content:center}
.ring{font-size:42px;font-weight:800}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:99;max-width:90%;text-align:center}
.toast.on{opacity:1}
.wc{margin-bottom:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.wc.me{border-color:var(--acc)}
.wv{position:relative;aspect-ratio:16/9;background:#000;cursor:pointer}
.wv video{width:100%;height:100%;object-fit:cover;display:block}
.who{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:2px 8px;border-radius:10px}
.x{position:absolute;right:6px;top:6px;border:0;background:rgba(0,0,0,.55);color:#fff;border-radius:10px;padding:2px 8px}
.cap{padding:8px 12px 0;font-size:14px;word-break:break-word}
.rx{display:flex;gap:6px;flex-wrap:wrap;padding:8px 10px 10px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:2px 10px;font-size:14px}
.chip.on{border-color:var(--acc);background:var(--accbg)}
.wrec{display:block;width:100%;aspect-ratio:16/9;border-radius:14px;border:2px dashed var(--acc);background:var(--accbg);color:var(--acc);font-weight:700;font-size:16px;margin-bottom:12px}
.wph{border:1px dashed var(--line);border-radius:14px;padding:12px;color:var(--mute);font-size:13px;margin-bottom:12px}
.mr{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.mbox input{background:#fff;color:#222;margin:6px 0}
#vm video{max-width:100%;max-height:90vh;border-radius:14px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
</head>
<body>
<main id="app"><h1>아워<span>로그</span> ⏱</h1><p class="sub">불러오는 중…</p></main>
<div class="modal" id="modal"><div class="mbox">
  <video id="mv" playsinline muted></video>
  <p id="mmsg"></p>
  <input id="cap" maxlength="40" placeholder="한 줄로 오늘을 적어보세요 (선택)" style="display:none">
  <div class="row" id="mbtn"></div>
</div></div>
<div class="modal" id="vm"><video id="vv" controls autoplay loop playsinline></video></div>
<div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const dk=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>dk(new Date());
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2400)}

/* ===== 설정: Supabase 프로젝트의 값을 붙여넣으세요 ===== */
const SUPABASE_URL="PASTE_YOUR_SUPABASE_URL";
const SUPABASE_KEY="PASTE_YOUR_PUBLISHABLE_KEY (sb_publishable_...)";
/* ===================================================== */

let sb,uid,myName,joined=[],R=null,monthDays={},poll=null,sig="";
const S={day:today(),month:new Date()};
const LS=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
const nm=(i,p)=>i===uid?"나":(p&&p.name)||"친구";
function clean(){clearInterval(poll)}

async function boot(){
  let url=SUPABASE_URL,key=SUPABASE_KEY;
  try{const r=await fetch("/api/config");if(r.ok){const c=await r.json();if(c.url&&c.key){url=c.url;key=c.key}}}catch(e){}
  if(url.startsWith("PASTE")||key.startsWith("PASTE")||!window.supabase){$("app").innerHTML='<h1>아워<span>로그</span> ⏱</h1><div class="card" style="margin-top:14px">Supabase 설정을 찾지 못했어요. Vercel 환경변수(project_URL_ID, API_key)를 확인하고 다시 배포해주세요.</div>';return}
  sb=supabase.createClient(url,key);
  uid=LS("hl_uid");if(!uid){uid="u"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);LS("hl_uid",uid)}
  myName=LS("hl_name");if(!myName){myName=(prompt("친구들에게 보일 이름을 적어주세요")||"").trim().slice(0,12)||"친구";LS("hl_name",myName)}
  try{joined=JSON.parse(LS("hl_rooms")||"[]")}catch(e){joined=[]}
  home();
}
function saveJoined(r){if(!joined.some(x=>x.id===r.id)){joined.push(r);LS("hl_rooms",JSON.stringify(joined))}}

function home(){
  R=null;clean();
  $("app").innerHTML=`<h1>아워<span>로그</span> ⏱</h1><p class="sub">${esc(myName)}님, 친구들과 1시간마다 2초 영상으로 일상을 나눠요.</p>
  <div class="rooms">${joined.length?joined.map(r=>`<button class="room" data-open="${esc(r.id)}"><b>${esc(r.name)}</b><small>입장 ›</small></button>`).join(""):'<div class="none">아직 참여한 방이 없어요. 아래에서 만들거나 코드로 입장하세요.</div>'}</div>
  <div class="card"><b>새 방 만들기</b><div class="form"><input id="nn" maxlength="20" placeholder="방 이름 (예: 우리 가족)"><button class="btn p" id="mk">만들기</button></div></div>
  <div class="card" style="margin-top:10px"><b>초대 코드로 입장</b><div class="form"><input id="cc" maxlength="8" placeholder="6자리 코드" style="text-transform:uppercase"><button class="btn" id="jn">입장하기</button></div></div>`;
  $("mk").onclick=makeRoom;$("jn").onclick=joinRoom;
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openRoom(joined.find(r=>r.id===b.dataset.open)));
}
async function makeRoom(){
  const name=$("nn").value.trim();if(!name){toast("방 이름을 적어주세요");return}
  const code=Array.from({length:6},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.random()*32|0]).join("");
  const id="r"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  const {error}=await sb.from("rooms").insert({id,name,code,owner:uid,ts:Date.now()});
  if(error){toast("방을 만들 수 없어요: "+error.message);return}
  const r={id,name,code};saveJoined(r);toast("방을 만들었어요. 코드: "+code);openRoom(r);
}
async function joinRoom(){
  const code=$("cc").value.trim().toUpperCase();if(!code)return;
  const {data,error}=await sb.from("rooms").select("id,name,code").eq("code",code).limit(1);
  if(error){toast("입장할 수 없어요: "+error.message);return}
  if(!data.length){toast("코드를 찾을 수 없어요");return}
  saveJoined(data[0]);openRoom(data[0]);
}
let members=[],owner=null,rx=[],plist=[],pickFor=null,showMem=false,warned=false,EMO=["❤️","😂","👍","🔥","😮","🥹"];
async function ensureMember(){
  const {data:me}=await sb.from("members").select("uid").eq("room_id",R.id).eq("uid",uid).limit(1);
  if(me&&me.length){await sb.from("members").update({name:myName}).eq("room_id",R.id).eq("uid",uid);return}
  const {data:mx}=await sb.from("members").select("pos").eq("room_id",R.id).order("pos",{ascending:false}).limit(1);
  await sb.from("members").insert({room_id:R.id,uid,name:myName,pos:(mx&&mx.length?mx[0].pos:0)+1,ts:Date.now()});
}
async function openRoom(r){
  R=r;clean();S.day=today();S.month=new Date();showMem=false;pickFor=null;members=[];plist=[];rx=[];owner=null;
  $("app").innerHTML=`<div class="top"><button class="btn" id="bk">‹</button><h2>${esc(r.name)}</h2><button class="code" id="cp">코드 ${esc(r.code)}</button><button class="btn" id="mb">👥</button></div>
  <div class="card cal" id="cal"></div><div id="feed"></div>`;
  $("bk").onclick=home;
  $("cp").onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(r.code).then(()=>toast("코드를 복사했어요"),()=>toast("코드: "+r.code))};
  $("mb").onclick=()=>{showMem=!showMem;drawAll()};
  $("feed").onclick=feedClick;
  drawCal();
  try{await ensureMember()}catch(e){}
  loadMonth();watchDay();
}
async function loadMonth(){
  const y=S.month.getFullYear(),m=S.month.getMonth();
  const {data}=await sb.from("posts").select("day").eq("room_id",R.id).gte("day",dk(new Date(y,m,1))).lte("day",dk(new Date(y,m+1,0))).limit(2000);
  monthDays={};(data||[]).forEach(x=>monthDays[x.day]=(monthDays[x.day]||0)+1);drawCal();
}
function drawCal(){
  const y=S.month.getFullYear(),m=S.month.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),t=today();
  let h=`<div class="calh"><button data-mv="-1">‹</button><b>${y}년 ${m+1}월</b><button data-mv="1">›</button></div><div class="grid">`+"일월화수목금토".split("").map(w=>`<div class="w">${w}</div>`).join("");
  for(let i=0;i<first;i++)h+="<div></div>";
  for(let d=1;d<=n;d++){const k=y+"-"+pad(m+1)+"-"+pad(d);h+=`<button class="d ${k===S.day?"on":""} ${k===t?"today":""}" data-day="${k}" ${k>t?"disabled":""}>${d}${monthDays[k]?"<i></i>":""}</button>`}
  $("cal").innerHTML=h+"</div>";
  $("cal").querySelectorAll("[data-mv]").forEach(b=>b.onclick=()=>{S.month=new Date(y,m+ +b.dataset.mv,1);loadMonth()});
  $("cal").querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{S.day=b.dataset.day;drawCal();watchDay()});
}
async function fetchDay(force){
  if(!R)return;
  const [p,m,x,r]=await Promise.all([
    sb.from("posts").select("*").eq("room_id",R.id).eq("day",S.day).limit(300),
    sb.from("members").select("*").eq("room_id",R.id).order("pos").limit(100),
    sb.from("reactions").select("*").eq("room_id",R.id).eq("day",S.day).limit(3000),
    sb.from("rooms").select("owner").eq("id",R.id).limit(1)]);
  if((m.error||x.error)&&!warned){warned=true;toast("Supabase에서 supabase-update.sql을 실행해주세요")}
  plist=p.data||[];members=m.data||[];rx=x.data||[];owner=r.data&&r.data[0]?r.data[0].owner:null;
  const n=(S.day===today()?new Date().getHours():-1)+S.day+plist.map(q=>q.id+(q.caption||"")).join()+members.map(q=>q.uid+q.pos+q.name).join()+rx.map(q=>q.post_id+q.uid+q.emoji).join()+owner;
  if(!force&&n===sig)return;sig=n;drawAll();
}
function watchDay(){clearInterval(poll);sig="";fetchDay(true);poll=setInterval(()=>fetchDay(false),6000)}
function cellHtml(u,p,hr,now){
  const mn=(members.find(m=>m.uid===u)||{}).name;
  if(p){
    const mine=u===uid,list=rx.filter(r=>r.post_id===p.id),cnt={};
    list.forEach(r=>cnt[r.emoji]=(cnt[r.emoji]||0)+1);
    let chips=Object.keys(cnt).map(e=>`<button class="chip ${list.some(r=>r.emoji===e&&r.uid===uid)?"on":""}" data-rx="${p.id}|${e}">${e} ${cnt[e]}</button>`).join("");
    chips+=`<button class="chip" data-pick="${p.id}">${pickFor===p.id?"✕":"＋"}</button>`;
    if(pickFor===p.id)chips+=EMO.map(e=>`<button class="chip" data-rx="${p.id}|${e}">${e}</button>`).join("");
    return `<div class="wc ${mine?"me":""}"><div class="wv" data-view="${esc(p.url)}"><video src="${esc(p.url)}" muted loop playsinline autoplay preload="metadata"></video><span class="who">${esc(nm(u,p))}</span>${mine?`<button class="x" data-del="${p.id}">🗑</button>`:""}</div>${p.caption?`<div class="cap">${esc(p.caption)}</div>`:""}<div class="rx">${chips}</div></div>`;
  }
  if(now&&u===uid)return `<button class="wrec" id="rec">● 지금 2초 찍기</button>`;
  if(now)return `<div class="wph"><b>${esc(mn||"친구")}</b> · 아직 안 올렸어요</div>`;
  return "";
}
function drawAll(){
  if(!$("feed"))return;
  const isToday=S.day===today(),H=new Date().getHours(),by={};
  plist.forEach(p=>(by[p.hour]=by[p.hour]||{})[p.uid]=p);
  const order=members.map(m=>m.uid),idx=u=>{const i=order.indexOf(u);return i<0?999:i};
  const [y,m,d]=S.day.split("-").map(Number),isOwner=owner===uid;
  let h="";
  if(showMem){
    h+=`<div class="card" style="margin-bottom:12px"><b>멤버 ${members.length}명</b>${isOwner?' <small style="color:var(--mute)">· 방장은 ▲▼로 순서를 바꿔요</small>':""}`+
    members.map((q,i)=>`<div class="mr"><span>${i+1}. ${esc(q.name||"친구")}${q.uid===owner?" 👑":""}${q.uid===uid?" (나)":""}</span>${isOwner?`<span><button class="chip" data-up="${q.uid}">▲</button> <button class="chip" data-down="${q.uid}">▼</button></span>`:""}</div>`).join("")+
    `<button class="btn" data-leave="1" style="margin-top:10px;width:100%">방 나가기</button></div>`;
  }
  h+=`<div class="sub" style="margin-top:0"><b style="color:var(--ink)">${m}월 ${d}일 (${"일월화수목금토"[new Date(y,m-1,d).getDay()]})</b> · 영상 ${plist.length}개</div>`;
  const hrs=new Set(Object.keys(by).map(Number));if(isToday)hrs.add(H);
  const arr=[...hrs].sort((a,b)=>b-a);
  if(!arr.length)h+='<div class="none">이 날은 올라온 영상이 없어요.</div>';
  arr.forEach(hr=>{
    const cell=by[hr]||{},now=isToday&&hr===H;
    let us=Object.keys(cell);
    if(now){us=order.concat(us.filter(u=>!order.includes(u)));if(!us.includes(uid))us.push(uid)}
    us.sort((a,b)=>idx(a)-idx(b));
    h+=`<div class="hour ${now?"now":""}"><h3>${pad(hr)}:00${now?" · 지금":""}</h3>${us.map(u=>cellHtml(u,cell[u],hr,now)).join("")}</div>`;
  });
  $("feed").innerHTML=h;
  document.querySelectorAll(".wv video").forEach(v=>v.play().catch(()=>{}));
  if($("rec"))$("rec").onclick=openRec;
}
async function feedClick(ev){
  const t=ev.target.closest("[data-rx],[data-pick],[data-del],[data-view],[data-up],[data-down],[data-leave]");if(!t)return;
  const d=t.dataset;
  if(d.pick){pickFor=pickFor===d.pick?null:d.pick;drawAll();return}
  if(d.rx){
    const i=d.rx.lastIndexOf("|"),pid=d.rx.slice(0,i),em=d.rx.slice(i+1);
    const mine=rx.find(r=>r.post_id===pid&&r.uid===uid&&r.emoji===em);pickFor=null;
    if(mine){rx=rx.filter(r=>r!==mine);drawAll();await sb.from("reactions").delete().eq("post_id",pid).eq("uid",uid).eq("emoji",em)}
    else{rx.push({post_id:pid,uid,emoji:em});drawAll();await sb.from("reactions").insert({post_id:pid,uid,emoji:em,room_id:R.id,day:S.day,ts:Date.now()})}
    fetchDay(true);return;
  }
  if(d.view){$("vv").src=d.view;$("vm").classList.add("on");$("vv").muted=false;$("vv").play().catch(()=>{});return}
  if(d.del){await delPost(d.del);return}
  if(d.up||d.down){await moveMember(d.up||d.down,d.up?-1:1);return}
  if(d.leave!==undefined)await leaveRoom();
}
$("vm").onclick=e=>{if(e.target.id==="vm"){$("vv").pause();$("vv").removeAttribute("src");$("vm").classList.remove("on")}};
async function delPost(id){
  const p=plist.find(q=>q.id===id);if(!p||p.uid!==uid)return;
  if(!confirm("이 영상을 삭제할까요? 삭제하면 이번 시간에 다시 올릴 수 있어요."))return;
  const path=p.path||decodeURIComponent((p.url.split("/clips/")[1]||"").split("?")[0]);
  if(path)await sb.storage.from("clips").remove([path]);
  const {error}=await sb.from("posts").delete().eq("id",id);
  if(error){toast("삭제 실패: "+error.message);return}
  toast("삭제했어요");
  if(monthDays[p.day]){monthDays[p.day]--;if(!monthDays[p.day])delete monthDays[p.day];drawCal()}
  fetchDay(true);
}
async function moveMember(u,dir){
  if(owner!==uid)return;
  const a=members.map(m=>m.uid),i=a.indexOf(u),j=i+dir;if(i<0||j<0||j>=a.length)return;
  [a[i],a[j]]=[a[j],a[i]];
  await Promise.all(a.map((x,k)=>sb.from("members").update({pos:k+1}).eq("room_id",R.id).eq("uid",x)));
  fetchDay(true);
}
async function leaveRoom(){
  if(!confirm("이 방에서 나갈까요? 내가 올린 영상은 그대로 남아요."))return;
  if(owner===uid){const o=members.find(m=>m.uid!==uid);if(o)await sb.from("rooms").update({owner:o.uid}).eq("id",R.id)}
  await sb.from("members").delete().eq("room_id",R.id).eq("uid",uid);
  joined=joined.filter(x=>x.id!==R.id);LS("hl_rooms",JSON.stringify(joined));
  toast("방에서 나왔어요");home();
}
/* ---------- recorder ---------- */
let stream=null,blob=null,prevUrl=null,slot=null;
const mv=$("mv"),mmsg=$("mmsg"),mbtn=$("mbtn");
function btns(arr){mbtn.innerHTML="";arr.forEach(([t,f,p])=>{const b=document.createElement("button");b.className="btn"+(p?" p":"");b.textContent=t;b.onclick=f;mbtn.appendChild(b)})}
function closeRec(){
  $("modal").classList.remove("on");$("cap").style.display="none";
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  if(prevUrl){URL.revokeObjectURL(prevUrl);prevUrl=null}
  mv.srcObject=null;mv.removeAttribute("src");blob=null;
}
let facing=LS("hl_facing")||"environment",sound=true;
const hasMic=()=>!!(stream&&stream.getAudioTracks().length);
const vc=()=>({facingMode:{ideal:facing},width:{ideal:480},height:{ideal:640}});
async function getStream(){
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  try{stream=await navigator.mediaDevices.getUserMedia({video:vc(),audio:true})}
  catch(e){stream=await navigator.mediaDevices.getUserMedia({video:vc(),audio:false});sound=false;toast("마이크를 쓸 수 없어 소리 없이 찍어요")}
}
async function flip(){
  const prev=facing,next=facing==="user"?"environment":"user";
  const audio=stream?stream.getAudioTracks():[];
  const vt=stream&&stream.getVideoTracks()[0];
  const curId=vt&&vt.getSettings?vt.getSettings().deviceId:null;
  mmsg.textContent="카메라 전환 중…";btns([]);
  if(stream)stream.getVideoTracks().forEach(t=>t.stop());
  await new Promise(r=>setTimeout(r,300));
  const base={width:{ideal:480},height:{ideal:640}};
  const gum=v=>navigator.mediaDevices.getUserMedia({video:{...base,...v},audio:false});
  const tries=[
    ()=>gum({facingMode:{exact:next}}),
    ()=>gum({facingMode:{ideal:next}}),
    async()=>{
      const ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==="videoinput"&&d.deviceId&&d.deviceId!==curId);
      const pick=ds.find(d=>/back|rear|environment|후면/i.test(d.label)===(next==="environment"))||ds[0];
      if(!pick)throw new Error("다른 카메라가 없어요");
      return gum({deviceId:{exact:pick.deviceId}});
    }
  ];
  let ns=null,err=null;
  for(const t of tries){
    try{ns=await t();
      const id=ns.getVideoTracks()[0].getSettings().deviceId;
      if(id&&id===curId&&tries.indexOf(t)<2){ns.getTracks().forEach(x=>x.stop());ns=null;err=new Error("같은 카메라가 열렸어요");await new Promise(r=>setTimeout(r,200));continue}
      break}catch(e){err=e;ns=null}
  }
  if(ns){facing=next;LS("hl_facing",facing);stream=new MediaStream([...ns.getVideoTracks(),...audio])}
  else{
    toast("전환 실패: "+(err&&(err.name||err.message)||"알 수 없는 오류"));
    try{const r=await gum({facingMode:{ideal:prev}});stream=new MediaStream([...r.getVideoTracks(),...audio])}
    catch(e2){mmsg.textContent="카메라를 다시 켤 수 없어요. 닫고 다시 시도해주세요.";btns([["닫기",closeRec]]);return}
  }
  showLive();
}
function toggleSound(){
  if(!hasMic()){toast("마이크 권한이 없어서 소리 없이 찍어요");return}
  sound=!sound;showLive();
}
async function openRec(){
  const n=new Date();slot={day:dk(n),hour:n.getHours()};
  const id=slot.day+"_"+pad(slot.hour)+"_"+uid;
  const {data}=await sb.from("posts").select("id").eq("id",R.id+"_"+id).limit(1);
  if(data&&data.length){toast("이번 시간은 이미 올렸어요");fetchDay(true);return}
  $("modal").classList.add("on");mmsg.textContent="카메라를 켜는 중…";btns([["닫기",closeRec]]);
  try{await getStream()}catch(e){mmsg.textContent="카메라를 사용할 수 없어요. 브라우저의 카메라 권한을 허용해주세요.";return}
  showLive();
}
function showLive(){
  $("cap").style.display="none";blob=null;mv.className=facing==="user"?"mir":"";mv.removeAttribute("src");mv.srcObject=stream;mv.muted=true;mv.loop=false;mv.play().catch(()=>{});
  mmsg.textContent=(facing==="user"?"전면":"후면")+" 카메라 · "+(sound&&hasMic()?"소리 켜짐":"소리 꺼짐")+" · 2초 촬영";
  btns([["닫기",closeRec],["🔄",flip],[sound&&hasMic()?"🔊":"🔇",toggleSound],["● 촬영",record,1]]);
}
function record(){
  const mime=["video/mp4","video/webm;codecs=vp9,opus","video/webm"].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||"";
  let rec;try{const rs=new MediaStream([...stream.getVideoTracks(),...(sound?stream.getAudioTracks():[])]);rec=new MediaRecorder(rs,mime?{mimeType:mime,videoBitsPerSecond:1200000}:{})}catch(e){mmsg.textContent="이 브라우저는 영상 촬영을 지원하지 않아요.";return}
  const ch=[];rec.ondataavailable=e=>e.data&&e.data.size&&ch.push(e.data);
  rec.onstop=()=>{blob=new Blob(ch,{type:rec.mimeType||mime||"video/webm"});preview()};
  btns([]);rec.start();let t=2;mmsg.innerHTML='<span class="ring">● 2</span>';
  const iv=setInterval(()=>{t--;if(t>0)mmsg.innerHTML='<span class="ring">● '+t+"</span>";else clearInterval(iv)},1000);
  setTimeout(()=>{if(rec.state!=="inactive")rec.stop()},2000);
}
function preview(){
  mv.srcObject=null;mv.className="";prevUrl=URL.createObjectURL(blob);mv.src=prevUrl;mv.loop=true;mv.muted=!(sound&&hasMic());mv.play().catch(()=>{mv.muted=true;mv.play().catch(()=>{})});
  mmsg.textContent="이대로 올릴까요?";$("cap").value="";$("cap").style.display="block";
  btns([["다시 찍기",()=>{URL.revokeObjectURL(prevUrl);prevUrl=null;showLive()}],["올리기",upload,1]]);
}
async function upload(){
  btns([]);$("cap").style.display="none";mmsg.textContent="올리는 중…";
  const ct=(blob.type||"video/webm").split(";")[0],ext=ct.includes("mp4")?"mp4":"webm";
  const key=slot.day+"_"+pad(slot.hour)+"_"+uid,path=R.id+"/"+key+"."+ext;
  try{
    const u=await sb.storage.from("clips").upload(path,blob,{contentType:ct,upsert:false});
    if(u.error)throw u.error;
    const url=sb.storage.from("clips").getPublicUrl(path).data.publicUrl;
    const i=await sb.from("posts").insert({id:R.id+"_"+key,room_id:R.id,uid,name:myName,day:slot.day,hour:slot.hour,url,path,caption:$("cap").value.trim().slice(0,40),ts:Date.now()});
    if(i.error)throw i.error;
    closeRec();toast("올렸어요! 폰에는 저장되지 않아요 ✓");
    if(slot.day.slice(0,7)===dk(S.month).slice(0,7)){monthDays[slot.day]=(monthDays[slot.day]||0)+1;drawCal()}
    fetchDay(true);
  }catch(e){
    $("cap").style.display="block";
    const dup=/duplicate|exists/i.test(e.message||"");
    mmsg.textContent=dup?"이번 시간은 이미 올렸어요.":"올리기 실패: "+(e.message||"다시 시도해주세요");
    btns(dup?[["닫기",closeRec]]:[["닫기",closeRec],["다시 시도",upload,1]]);
  }
}
boot();
</script>
